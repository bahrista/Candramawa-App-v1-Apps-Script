<style>
  :root{
    --navy:#1F3864;
    --navy-light:#2E5395;
    --gold:#FFD966;
    --bg:#F4F6F9;
    --card:#FFFFFF;
    --border:#E3E7EE;
    --text:#1F2937;
    --muted:#6B7280;
    --green:#2E7D32;
    --amber:#B26A00;
    --red:#B3261E;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }

  /* APP SHELL — Sidebar (kiri) + Main Area (kanan), gaya dashboard admin */
  #appShell{ display:flex; min-height:100vh; }

  #sidebar{
    width:230px; flex-shrink:0; background:var(--navy); color:#fff;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    transition:width 0.2s ease; z-index:50; overflow:hidden;
  }
  .sidebar-brand{
    padding:20px 18px; font-weight:800; font-size:15px; line-height:1.3;
    border-bottom:1px solid rgba(255,255,255,0.12); white-space:nowrap; overflow:hidden;
  }
  #sidebarNav{ flex:1; padding:10px 0; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
  .side-link{
    display:flex; align-items:center; gap:10px; background:transparent; border:none;
    color:#C9D6EA; padding:12px 20px; font-weight:700; font-size:13px; cursor:pointer;
    text-align:left; border-left:3px solid transparent; white-space:nowrap; width:100%;
  }
  .side-link .side-icon{ font-size:15px; flex-shrink:0; }
  .side-link:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .side-link.active{ background:rgba(255,255,255,0.1); color:#fff; border-left-color:var(--gold); }

  .sidebar-collapse-btn{
    background:transparent; border:none; border-top:1px solid rgba(255,255,255,0.12);
    color:#C9D6EA; padding:12px; font-size:12px; font-weight:700; cursor:pointer;
    text-align:center; white-space:nowrap; overflow:hidden;
  }
  .sidebar-collapse-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; }

  /* Mode COLLAPSED — desktop only, sidebar jadi icon-only */
  #sidebar.collapsed{ width:64px; }
  #sidebar.collapsed .brand-text{ display:none; }
  #sidebar.collapsed .sidebar-brand{ text-align:center; padding:20px 4px; }
  #sidebar.collapsed .side-link{ justify-content:center; padding:12px 0; }
  #sidebar.collapsed .side-link .side-label{ display:none; }
  #sidebar.collapsed .sidebar-collapse-btn .collapse-label{ display:none; }

  #sidebarBackdrop{ display:none; }

  .hamburger-btn{
    display:none; background:transparent; border:none; font-size:20px; cursor:pointer;
    color:var(--navy); padding:4px 8px;
  }

  #mainArea{ flex:1; min-width:0; display:flex; flex-direction:column; }

  #topbar{
    background:#fff; border-bottom:1px solid var(--border); color:var(--text); padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  #topbar h1{ font-size:19px; margin:0; font-weight:700; color:var(--navy); }
  #topbar .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  #refreshBtn{
    background:var(--navy); color:#fff; border:none; padding:8px 14px;
    border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;
  }
  #refreshBtn:hover{ opacity:0.9; }
  #logoutBtn{
    background:#fff; color:var(--red); border:1px solid var(--red); padding:8px 14px;
    border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;
  }
  #logoutBtn:hover{ background:#FDEEEE; }
  #loggedInUser{ font-size:12px; font-weight:700; color:var(--navy); margin-right:4px; }

  main{ flex:1; padding:20px; overflow-y:auto; }
  .hidden{ display:none !important; }

  #loadingState, #errorState{ text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }
  #errorState{ color:var(--red); display:none; }

  #warningsBox{
    background:#FFF3CD; color:var(--amber); border:1px solid #FFE08A;
    border-radius:10px; padding:12px 16px; font-size:12px; margin-bottom:16px; line-height:1.6;
  }

  #kpiRow{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
  .kpi-card .num{ font-size:26px; font-weight:800; color:var(--navy); }
  .kpi-card .label{ font-size:12px; color:var(--muted); margin-top:2px; }

  /* Grid 7 card statistik di tab Home */
  .home-stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; }

  .section{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; }
  .section h2{ font-size:15px; margin:0 0 14px 0; color:var(--navy); display:flex; align-items:center; gap:8px; }

  #brandFilterRow{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .filter-group{ display:flex; align-items:center; gap:8px; background:#EAF0FB; border-radius:20px; padding:6px 12px; }
  .filter-group label{ font-size:11px; font-weight:700; color:var(--navy); }
  .filter-group select{ border:none; background:transparent; color:var(--navy); font-size:12px; font-weight:700; cursor:pointer; }

  #chartsGrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(400px,1fr)); gap:16px; }
  .chart-box h3{ font-size:13px; color:var(--navy); margin:0 0 6px 0; }
  .chart-hint{ font-size:10px; color:var(--muted); margin-bottom:6px; }
  .chart-canvas{ width:100%; height:280px; }
  .chart-canvas-sm{ width:100%; height:220px; }

  /* Calendar Stats Grid */
  .cal-stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }

  table{ width:100%; border-collapse:collapse; font-size:12px; }
  thead th{ text-align:left; background:var(--navy); color:#fff; padding:8px 10px; position:sticky; top:0; }
  tbody td{ padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  tbody tr:hover{ background:#F7FAFF; }

  .rank-table-wrap{ max-height:340px; overflow:auto; margin-top:6px; }
  .rank-table td.num-col{ text-align:center; font-weight:700; }
  .pct-bar-outer{ background:#EDEDED; border-radius:6px; overflow:hidden; height:8px; width:100%; margin-top:3px; }
  .pct-bar-inner{ background:var(--green); height:100%; }
  .pct-label{ font-size:10px; color:var(--muted); }
  .clickable-name{ cursor:pointer; color:var(--navy-light); font-weight:700; }
  .clickable-name:hover{ text-decoration:underline; }

  .status-pill{ display:inline-block; padding:2px 8px; border-radius:12px; font-size:10px; font-weight:700; }
  .status-Draft{ background:#EDEDED; color:#555; }
  .status-Review{ background:#FFF3CD; color:var(--amber); }
  .status-Revisi{ background:#FDE2E1; color:var(--red); }
  .status-ReadytoPost, .status-Scheduled{ background:#DCEEFF; color:#0B5CAB; }
  .status-Published{ background:#DFF3E0; color:var(--green); }
  .status-Cancelled{ background:#E5E5E5; color:#888; text-decoration:line-through; }
  .brand-pill{ display:inline-block; padding:2px 8px; border-radius:12px; font-size:10px; font-weight:700; background:#EAF0FB; color:var(--navy); }

  #filterBar{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  #filterChip{ background:#EAF0FB; color:var(--navy); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; }
  #clearFilterBtn{ border:1px solid var(--border); background:#fff; color:var(--text); padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer; }
  #tableEmpty{ text-align:center; color:var(--muted); padding:20px; font-size:12px; }

  /* Calendar Legend */
  .legend-container{ display:flex; align-items:center; gap:12px; font-size:11px; font-weight:600; color:var(--muted); }
  .legend-item{ display:flex; align-items:center; gap:4px; }
  .legend-box{ width:12px; height:12px; border-radius:3px; display:inline-block; }
  .legend-published{ background:#2E7D32; }
  .legend-ready{ background:#0B5CAB; }
  .legend-review{ background:#B26A00; }
  .legend-draft{ background:#6B7280; }

  /* Calendar Grid Style */
  .calendar-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin-top:10px; }
  .cal-day-head{ background:var(--navy); color:#fff; text-align:center; padding:6px; font-weight:bold; font-size:11px; border-radius:4px; }
  .cal-day-cell{ background:#fff; border:1px solid var(--border); border-radius:8px; min-height:100px; padding:6px; font-size:10px; position:relative; }
  .cal-day-cell.other-month{ background:#F9FAFB; opacity:0.5; }
  .cal-day-num{ font-weight:bold; color:var(--navy); margin-bottom:4px; display:block; border-bottom:1px solid #EEF; padding-bottom:2px; }
  
  .cal-item{
    background:#EDEDED; border-left:3px solid #6B7280;
    padding:4px 5px; border-radius:4px; margin-bottom:4px; font-size:9px; line-height:1.2; word-break:break-word;
  }
  .cal-item a{ color:var(--text); text-decoration:none; font-weight:bold; }
  .cal-item a:hover{ text-decoration:underline; color:var(--navy-light); }
  
  .cal-item.is-published{ border-left-color:var(--green); background:#EAF7EA; }
  .cal-item.is-ready{ border-left-color:#0B5CAB; background:#EAF3FF; }
  .cal-item.is-review{ border-left-color:var(--amber); background:#FFF8E6; }

  /* TAB HOME */
  #homeWelcome p{ font-size:13px; line-height:1.7; color:var(--text); margin:0; }
  .btn-link{
    display:inline-block; background:var(--navy); color:#fff !important; padding:6px 12px;
    border-radius:8px; font-size:11px; font-weight:700; text-decoration:none;
  }
  .btn-link:hover{ opacity:0.85; }

  /* LOGIN SCREEN */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    padding:20px;
  }
  #loginBox{
    background:#fff; border-radius:var(--radius); padding:32px 28px; width:100%; max-width:360px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
  }
  #loginBox h1{ font-size:20px; color:var(--navy); margin:0 0 4px 0; text-align:center; }
  .login-sub{ font-size:12px; color:var(--muted); text-align:center; margin:0 0 20px 0; }
  #loginBox label{ display:block; font-size:11px; font-weight:700; color:var(--navy); margin:12px 0 4px 0; }
  #loginBox input{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    font-size:13px; font-family:inherit;
  }
  #loginBox input:focus{ outline:none; border-color:var(--navy-light); }
  #loginBox button{
    width:100%; margin-top:20px; background:var(--navy); color:#fff; border:none;
    padding:11px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;
  }
  #loginBox button:hover{ opacity:0.9; }
  #loginBox button:disabled{ opacity:0.6; cursor:not-allowed; }
  #loginError{
    background:#FDE2E1; color:var(--red); border-radius:8px; padding:8px 12px;
    font-size:12px; margin-bottom:4px;
  }

  #topbarRight{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  /* Badge "+N" di pojok kanan bawah kotak tanggal kalender */
  .cal-more-badge{
    position:absolute; right:6px; bottom:6px; background:var(--navy); color:#fff;
    border:none; border-radius:10px; font-size:9px; font-weight:700; padding:2px 6px; cursor:pointer;
  }
  .cal-more-badge:hover{ background:var(--navy-light); }

  /* Modal popup — daftar konten lengkap per tanggal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex;
    align-items:center; justify-content:center; z-index:300; padding:20px;
  }
  .modal-box{
    background:#fff; border-radius:var(--radius); max-width:480px; width:100%;
    max-height:80vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .modal-header h3{ margin:0; font-size:15px; color:var(--navy); }
  .modal-close-btn{ background:transparent; border:none; font-size:16px; cursor:pointer; color:var(--muted); }
  .modal-close-btn:hover{ color:var(--text); }
  .modal-body{ padding:16px 20px; overflow-y:auto; }
  .modal-body .cal-item{ font-size:12px; padding:8px 10px; margin-bottom:8px; }
  .modal-box-wide{ max-width:560px; }
  .modal-footer{
    display:flex; justify-content:flex-end; gap:10px; padding:14px 20px;
    border-top:1px solid var(--border); flex-shrink:0;
  }

  /* Form Tambah/Edit Konten */
  .form-label{ display:block; font-size:11px; font-weight:700; color:var(--navy); margin:12px 0 4px 0; }
  .form-label:first-of-type{ margin-top:0; }
  .required{ color:var(--red); }
  .form-input{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:13px; font-family:inherit; color:var(--text); background:#fff;
  }
  .form-input:focus{ outline:none; border-color:var(--navy-light); }

  .btn-primary{
    background:var(--navy); color:#fff; border:none; padding:8px 16px;
    border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .btn-primary:hover{ opacity:0.9; }
  .btn-primary:disabled{ opacity:0.6; cursor:not-allowed; }
  .btn-secondary{
    background:#fff; color:var(--text); border:1px solid var(--border); padding:8px 16px;
    border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .btn-secondary:hover{ background:#F7FAFF; }

  /* Tombol ikon Edit/Hapus di tabel Detail Konten */
  .btn-icon{ background:transparent; border:none; cursor:pointer; font-size:14px; padding:4px 8px; border-radius:6px; }
  .btn-icon:hover{ background:#EAF0FB; }
  .btn-icon-danger:hover{ background:#FDE2E1; }

  /* ===================================================================
     RESPONSIVE — MOBILE (sidebar jadi overlay slide-in, bukan icon-only)
     =================================================================== */
  @media (max-width: 768px){
    .hamburger-btn{ display:inline-block; }
    .sidebar-collapse-btn{ display:none; } /* fitur collapse desktop gak relevan di mobile */

    #sidebar{
      position:fixed; top:0; left:0; height:100vh; width:230px;
      transform:translateX(-100%); transition:transform 0.25s ease; z-index:200;
    }
    #sidebar.mobile-open{ transform:translateX(0); }

    /* Kalau kebetulan lagi mode "collapsed" (dari desktop) terus layar diresize ke mobile,
       paksa balik ke tampilan lebar penuh + label kebaca, biar gak nyangkut icon-only di mobile. */
    #sidebar.collapsed{ width:230px; }
    #sidebar.collapsed .brand-text,
    #sidebar.collapsed .side-link .side-label{ display:inline; }
    #sidebar.collapsed .sidebar-brand{ text-align:left; padding:20px 18px; }
    #sidebar.collapsed .side-link{ justify-content:flex-start; padding:12px 20px; }

    #sidebarBackdrop.show{
      display:block; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:150;
    }

    /* Kalender di mobile dibikin lebih ramping — konten cuma preview singkat + badge */
    .calendar-grid{ gap:3px; }
    .cal-day-cell{ min-height:56px; padding:4px 3px; }
    .cal-day-num{ font-size:9px; margin-bottom:2px; padding-bottom:1px; }
    .cal-item{ font-size:8px; padding:2px 3px; margin-bottom:0; }
    .cal-more-badge{ font-size:8px; padding:1px 4px; right:3px; bottom:3px; }
  }

  footer{ text-align:center; color:var(--muted); font-size:11px; padding:16px; }
</style>
